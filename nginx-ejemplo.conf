# Agregar dentro del server{} del sitio (CloudPanel: Vhost). Ajustar la ruta al sitio.
# Impide listar/leer los archivos subidos y ejecutar PHP en la carpeta de trabajo.
location ^~ /wp-content/uploads/generador_evaluaciones/uploads/ { deny all; return 403; }
location ~* ^/wp-content/uploads/generador_evaluaciones/.*\.php$ { deny all; return 403; }
location ^~ /wp-content/uploads/generador_evaluaciones/ { autoindex off; }
